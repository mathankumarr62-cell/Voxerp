<!doctype html><html><head><meta charset="utf-8"><title>VoxERP</title><style>body{font:16px system-ui;max-width:720px;margin:3rem auto;padding:0 1rem}textarea{width:100%;min-height:5rem}button{padding:.6rem 1rem;margin:.5rem .25rem 0 0}#reply{white-space:pre-wrap;padding:1rem;background:#f3f5f7;border-radius:.5rem}</style></head><body>
<header><h1>VoxERP</h1><p>Signed in as {{ request.user.get_username }} · <form method="post" action="{% url 'logout' %}" style="display:inline">{% csrf_token %}<button type="submit">Log out</button></form></p></header>
<main><label for="text">Ask about your marks, attendance, timetable, or policy</label><textarea id="text" maxlength="4000" placeholder="What is my attendance?"></textarea><div><button id="send">Send</button><button id="mic" type="button">Use microphone</button><span id="confirmation" hidden><button id="yes">Yes, confirm</button><button id="no">No, cancel</button></span></div><p id="status"></p><div id="reply" aria-live="polite"></div></main>
<script>
const csrf=document.querySelector('[name=csrfmiddlewaretoken]').value;let pending=null;
async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':csrf},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.reply_text||'Request failed');return data}
function show(data){document.querySelector('#reply').textContent=data.reply_text||'No response';if('speechSynthesis'in window)speechSynthesis.speak(new SpeechSynthesisUtterance(data.reply_text||''));}
async function ask(){try{const text=document.querySelector('#text').value;document.querySelector('#status').textContent='Working…';const data=await post('/api/query/',{text});pending=data.pending||null;document.querySelector('#confirmation').hidden=!pending;show(data);document.querySelector('#status').textContent=pending?'This action needs confirmation. Choose yes or no.':''}catch(e){document.querySelector('#status').textContent=e.message}}
async function decide(confirm){if(!pending)return;try{const data=await post('/api/confirm/',{confirm,pending});pending=null;document.querySelector('#confirmation').hidden=true;show(data);document.querySelector('#status').textContent=''}catch(e){pending=null;document.querySelector('#confirmation').hidden=true;document.querySelector('#status').textContent=e.message}}
document.querySelector('#send').onclick=ask;
document.querySelector('#yes').onclick=()=>decide('yes');document.querySelector('#no').onclick=()=>decide('no');
document.querySelector('#mic').onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){document.querySelector('#status').textContent='Speech recognition is unavailable; text input still works.';return}const r=new R();r.onresult=e=>{const spoken=e.results[0][0].transcript.trim().toLowerCase();if(pending&&(spoken==='yes'||spoken==='no'))decide(spoken);else{document.querySelector('#text').value=e.results[0][0].transcript;ask()}};r.onerror=()=>document.querySelector('#status').textContent='Voice input failed; please use text input.';r.start()};
</script></body></html>
